name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  GOFLAGS: -mod=mod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Install system deps (systray)
      run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libgtk-3-dev libayatana-appindicator3-dev

    - name: Build
      run: CGO_ENABLED=1 go build -v ./...

    - name: Vet
      run: CGO_ENABLED=1 go vet ./...

    - name: Test
      run: CGO_ENABLED=1 go test -count=1 ./...
