name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: herdr-systray-linux-amd64


          - label: darwin-amd64
            runner: macos-13
            goos: darwin
            goarch: amd64
            asset: herdr-systray-darwin-amd64

          - label: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            asset: herdr-systray-darwin-arm64

          - label: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset: herdr-systray-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Install MinGW (Windows CGO)
        if: runner.os == 'Windows'
        run: choco install mingw -y --no-progress

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o ${{ matrix.asset }} .

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} ${{ matrix.asset }} --clobber
